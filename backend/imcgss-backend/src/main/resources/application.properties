spring.application.name=imcgss-backend

# Render binds the port via PORT environment variable
server.port=${PORT:8080}

# Database Connection (Default PostgreSQL for Render, overridable by env vars)
# DatabaseConfig.java will automatically parse Render's DATABASE_URL if present
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/imcgss_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
