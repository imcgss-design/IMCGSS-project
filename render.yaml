services:
  # IMCGSS Web Service (Serves UI + REST API)
  - type: web
    name: imcgss-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/test
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: imcgss-db
          property: connectionString

databases:
  # Render PostgreSQL Database
  - name: imcgss-db
    databaseName: imcgss_db
    user: imcgss_user
    plan: free
    region: oregon
