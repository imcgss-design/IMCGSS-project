<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMCGSS - User Management</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #172b4d;
        }

        /* HEADER */
        .header {
            background: #0b1f3a;
            color: white;
            padding: 18px 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 22px;
        }

        .back-btn {
            background: #1769d1;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
        }

        .back-btn:hover {
            background: #0e55b0;
        }

        /* MAIN */
        .container {
            max-width: 1100px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .page-title {
            margin-bottom: 25px;
        }

        .page-title h2 {
            font-size: 28px;
            margin-bottom: 6px;
        }

        .page-title p {
            color: #718096;
        }

        /* FORM CARD */
        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.07);
            margin-bottom: 30px;
        }

        .card h3 {
            margin-bottom: 22px;
            color: #102a50;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 7px;
        }

        input,
        select {
            height: 45px;
            border: 1px solid #d5dce8;
            border-radius: 8px;
            padding: 0 12px;
            font-size: 14px;
            outline: none;
            background: #fafcff;
        }

        input:focus,
        select:focus {
            border-color: #1769d1;
            box-shadow: 0 0 0 3px rgba(23,105,209,0.10);
        }

        .buttons {
            margin-top: 25px;
            display: flex;
            gap: 12px;
        }

        .save-btn {
            background: #1769d1;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .save-btn:hover {
            background: #0e55b0;
        }

        .clear-btn {
            background: #e8edf5;
            color: #243b5a;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
        }

        /* TABLE */
        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #f1f5fa;
            text-align: left;
            padding: 13px;
            font-size: 13px;
        }

        td {
            padding: 13px;
            border-bottom: 1px solid #edf0f5;
            font-size: 13px;
        }

        .role {
            background: #e7f0ff;
            color: #1769d1;
            padding: 5px 9px;
            border-radius: 20px;
            font-size: 12px;
        }

        .status {
            color: #16834b;
            font-weight: 600;
        }

        .delete-btn {
            background: #fff0f0;
            color: #d93025;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
        }

        .empty {
            text-align: center;
            color: #8a97a8;
            padding: 25px;
        }

        @media (max-width: 700px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

            .header {
                padding: 15px 20px;
            }

            .header h1 {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <div class="header">
        <h1>IMCGSS | User Management</h1>

        <button class="back-btn" onclick="goDashboard()">
            ← Dashboard
        </button>
    </div>


    <div class="container">

        <!-- TITLE -->
        <div class="page-title">
            <h2>User Management</h2>
            <p>Add and manage IMCGSS system users.</p>
        </div>


        <!-- ADD USER FORM -->
        <div class="card">

            <h3>Add New User</h3>

            <form id="userForm">

                <div class="form-grid">

                    <div class="form-group">
                        <label>Full Name</label>
                        <input
                            type="text"
                            id="name"
                            placeholder="Enter full name"
                            required>
                    </div>


                    <div class="form-group">
                        <label>User ID</label>
                        <input
                            type="text"
                            id="userId"
                            placeholder="Example: FAC001"
                            required>
                    </div>


                    <div class="form-group">
                        <label>Email</label>
                        <input
                            type="email"
                            id="email"
                            placeholder="Enter email"
                            required>
                    </div>


                    <div class="form-group">
                        <label>Role</label>

                        <select id="role" required>
                            <option value="">Select role</option>
                            <option>Administrator</option>
                            <option>Faculty</option>
                            <option>Coordinator</option>
                            <option>HOD / Reviewer</option>
                            <option>Student</option>
                        </select>
                    </div>


                    <div class="form-group">
                        <label>Department</label>

                        <select id="department" required>
                            <option value="">Select department</option>
                            <option>Computer Science</option>
                            <option>Electronics</option>
                            <option>Commerce</option>
                            <option>Management</option>
                            <option>Mathematics</option>
                        </select>
                    </div>


                    <div class="form-group">
                        <label>Status</label>

                        <select id="status">
                            <option>Active</option>
                            <option>Inactive</option>
                        </select>
                    </div>


                    <div class="form-group">
                        <label>Password</label>
                        <input
                            type="password"
                            id="password"
                            placeholder="Enter password"
                            required>
                    </div>


                    <div class="form-group">
                        <label>Confirm Password</label>
                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm password"
                            required>
                    </div>

                </div>


                <div class="buttons">

                    <button
                        type="submit"
                        class="save-btn">
                        Save User
                    </button>

                    <button
                        type="button"
                        class="clear-btn"
                        onclick="clearForm()">
                        Clear
                    </button>

                </div>

            </form>

        </div>


        <!-- USER TABLE -->
        <div class="card">

            <h3>Registered Users</h3>

            <div class="table-wrapper">

                <table>

                    <thead>
                        <tr>
                            <th>User ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Department</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="userTableBody"></tbody>

                </table>

            </div>

        </div>

    </div>


<script>

    // Load users from browser storage
    let users =
        JSON.parse(localStorage.getItem("imcgss_users")) || [];


    // Display users
    function displayUsers() {

        const table =
            document.getElementById("userTableBody");

        table.innerHTML = "";


        if (users.length === 0) {

            table.innerHTML = `
                <tr>
                    <td colspan="7" class="empty">
                        No users added yet.
                    </td>
                </tr>
            `;

            return;
        }


        users.forEach((user, index) => {

            table.innerHTML += `
                <tr>

                    <td>${user.userId}</td>

                    <td>${user.name}</td>

                    <td>${user.email}</td>

                    <td>
                        <span class="role">
                            ${user.role}
                        </span>
                    </td>

                    <td>${user.department}</td>

                    <td class="status">
                        ${user.status}
                    </td>

                    <td>
                        <button
                            class="delete-btn"
                            onclick="deleteUser(${index})">
                            Delete
                        </button>
                    </td>

                </tr>
            `;
        });
    }


    // Save user
    document
        .getElementById("userForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();


            const name =
                document.getElementById("name").value.trim();

            const userId =
                document.getElementById("userId").value.trim();

            const email =
                document.getElementById("email").value.trim();

            const role =
                document.getElementById("role").value;

            const department =
                document.getElementById("department").value;

            const status =
                document.getElementById("status").value;

            const password =
                document.getElementById("password").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;


            // Password validation
            if (password !== confirmPassword) {

                alert("Passwords do not match.");
                return;

            }


            // Check duplicate User ID
            const existingUser =
                users.find(user => user.userId === userId);


            if (existingUser) {

                alert("This User ID already exists.");
                return;

            }


            // User data sent to Java backend
            const newUser = {

                fullName: name,
                userId: userId,
                email: email,
                role: role,
                department: department,
                status: status

            };


            try {

                // Send data to Java Spring Boot backend
                const response = await fetch(
                    "http://localhost:8080/api/users",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify(newUser)
                    }
                );


                if (!response.ok) {

                    throw new Error("Backend request failed");

                }


                const result = await response.text();


                console.log("Java Backend:", result);


                // Save to browser storage for current MVP
                const displayUser = {

                    name: name,
                    userId: userId,
                    email: email,
                    role: role,
                    department: department,
                    status: status

                };


                users.push(displayUser);


                localStorage.setItem(
                    "imcgss_users",
                    JSON.stringify(users)
                );


                alert("User added successfully to Java backend!");


                clearForm();

                displayUsers();


            } catch (error) {

                console.error(error);

                alert(
                    "Could not connect to Java backend. " +
                    "Make sure Spring Boot is running on port 8080."
                );

            }

        });


    // Delete user
    function deleteUser(index) {

        if (confirm("Delete this user?")) {

            users.splice(index, 1);

            localStorage.setItem(
                "imcgss_users",
                JSON.stringify(users)
            );

            displayUsers();
        }
    }


    // Clear form
    function clearForm() {

        document.getElementById("userForm").reset();

    }


    // Back to dashboard
    function goDashboard() {

        window.location.href = "index.html";

    }


    // Load users when page opens
    displayUsers();

</script>

</body>
</html>
